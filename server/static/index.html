<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Finger Camera</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; background: #000; color: #eee;
    font: 14px/1.5 -apple-system, "Hiragino Sans", sans-serif;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
  }
  #stage {
    position: relative; width: 100%; max-width: 960px;
    aspect-ratio: 4 / 3; background: #111;
  }
  #stream, #overlay { position: absolute; inset: 0; width: 100%; height: 100%; }
  #stream { object-fit: contain; }
  #status {
    margin: 0 12px 12px; min-height: 1.5em;
    font-variant-numeric: tabular-nums; color: #9ad;
  }
  #status.error { color: #f88; }
</style>
</head>
<body>
  <div id="stage">
    <img id="stream" src="/stream" alt="TimerCam">
    <canvas id="overlay"></canvas>
  </div>
  <p id="status">読み込み中…</p>
  <script type="module" src="/static/app.js"></script>
</body>
</html>
